name: Sync from Gitee

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: xianyu-clone

      - name: Pull latest from Gitee
        run: |
          git clone --depth 1 https://gitee.com/zhushenhuanghun168/xianyu-clone.git /tmp/gitee
          rsync -a --delete --exclude='.git' /tmp/gitee/ ./

      - name: Commit and push if changed
        run: |
          git config user.name "gitee-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes from Gitee"
          else
            git commit -m "chore: sync from Gitee"
            git push origin HEAD:xianyu-clone
          fi
