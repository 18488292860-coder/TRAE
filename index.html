<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAE - 官方网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow-x: hidden;
        }
        .container { text-align: center; padding: 2rem; max-width: 800px; width: 100%; }
        .logo {
            font-size: 5rem; font-weight: 800;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5, #00d2ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            margin-bottom: 1rem; letter-spacing: 4px;
        }
        @keyframes shine { to { background-position: 200% center; } }
        .subtitle { font-size: 1.5rem; color: rgba(255,255,255,0.8); margin-bottom: 2rem; font-weight: 300; }
        .description { font-size: 1.1rem; color: rgba(255,255,255,0.6); line-height: 1.8; margin-bottom: 3rem; }
        .badges { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }
        .badge {
            padding: 0.5rem 1.2rem; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
            font-size: 0.9rem; backdrop-filter: blur(10px);
        }
        .links { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .link-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.8rem 2rem; background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .link-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,210,255,0.3); }
        .link-btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); }
        footer { margin-top: 4rem; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        @media (max-width: 600px) {
            .logo { font-size: 3rem; }
            .subtitle { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">TRAE</h1>
        <p class="subtitle">这是 TRAE 的官方 GitHub 仓库</p>
        <p class="description">
            欢迎来到 TRAE 官方网站。TRAE 致力于提供卓越的开发体验，
            帮助开发者更高效地构建、测试和部署应用程序。
        </p>
        <div class="badges">
            <span class="badge">🚀 高效开发</span>
            <span class="badge">⚡ 极速部署</span>
            <span class="badge">🔧 全栈支持</span>
        </div>
        <div class="links">
            <a href="https://github.com/18488292860-coder/TRAE" class="link-btn" target="_blank">📦 GitHub 仓库</a>
            <a href="README.md" class="link-btn secondary">📖 查看文档</a>
        </div>
        <footer><p>&copy; 2024 TRAE. All rights reserved.</p></footer>
    </div>
</body>
</html>
